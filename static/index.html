<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CodeMind — Kendi Kod Modeli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="bg"></div>
  <main class="shell">
    <header class="hero">
      <p class="brand">CodeMind</p>
      <h1>Kendi modelin. Dış AI API yok.</h1>
      <p class="lede">Küçük bir karakter dil modeli NumPy ile eğitilir; geçerli Python ürettiğinde kendini güçlendirir.</p>
    </header>

    <section class="panel controls" aria-label="Kontroller">
      <label>
        Prompt
        <input id="prompt" type="text" value="def " maxlength="80" />
      </label>
      <label>
        Sıcaklık
        <input id="temp" type="range" min="0.2" max="1.4" step="0.05" value="0.7" />
      </label>
      <div class="buttons">
        <button id="btn-generate" type="button">Kod üret</button>
        <button id="btn-train" type="button" class="ghost">50 adım eğit</button>
        <button id="btn-self" type="button" class="ghost">1 self-train</button>
        <button id="btn-auto" type="button" class="accent">Sürekli öğren: AÇ</button>
      </div>
    </section>

    <section class="panel output" aria-label="Çıktı">
      <div class="out-head">
        <h2>Üretilen kod</h2>
        <span id="valid-badge" class="badge">—</span>
      </div>
      <pre id="output" class="code">Hazır. Model arka planda kendini eğitiyor olabilir.</pre>
    </section>

    <section class="panel stats" aria-label="Durum">
      <h2>Eğitim durumu</h2>
      <div class="grid">
        <div><span>Adım</span><strong id="s-steps">0</strong></div>
        <div><span>Self-train</span><strong id="s-rounds">0</strong></div>
        <div><span>Kabul</span><strong id="s-ok">0</strong></div>
        <div><span>Red</span><strong id="s-bad">0</strong></div>
        <div><span>Loss</span><strong id="s-loss">—</strong></div>
        <div><span>Durum</span><strong id="s-msg">—</strong></div>
      </div>
      <ul id="history" class="history"></ul>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
